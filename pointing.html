<table>
    <thead>
        <tr>
            <th>الخدام</th><th>اليومية</th><th>الأيام</th><th>تسبيق</th><th>الباقي</th>
        </tr>
    </thead>
    <tbody>
        {% for worker in workers %}
        <tr>
            <td>{{ worker.name }}</td>
            <td>{{ worker.rate }}</td>
            <td>{{ worker.days }}</td>
            <td>{{ worker.advance }}</td>
            <td><strong>{{ worker.balance }}</strong></td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<div class="total-box">
    مجموع ما يجب دفعه حالياً: {{ total }} درهم
</div>
