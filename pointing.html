<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوانتاج إنفراسيرما</title>
    <style>
        body { font-family: Arial; padding: 15px; background: #f0f2f5; text-align: right; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #007bff; color: white; font-weight: bold; cursor: pointer; border: none; }
        .delete-btn { background: #dc3545; width: auto; padding: 5px 10px; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 14px; }
        th { background: #343a40; color: white; }
        .total-box { background: #28a745; color: white; padding: 10px; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>

    <h2>👷 بوانتاج ومصاريف الخدامة</h2>

    <div class="card">
        <h3>إضافة خدام أو مصروف</h3>
        <input type="text" id="workerName" placeholder="سمية الخدام (أو نوع المصروف)">
        <input type="number" id="dailyRate" placeholder="الأجرة اليومية (درهم)">
        <input type="number" id="daysWorked" placeholder="عدد الأيام (مثلا 1 أو 0.5)">
        <input type="number" id="expense" placeholder="المصروف / التسبيق (درهم)" value="0">
        <button onclick="addEntry()">قيد في الحساب</button>
    </div>

    <div id="displayArea"></div>

    <script>
        let data = JSON.parse(localStorage.getItem('pointingData') || '[]');

        function addEntry() {
            const name = document.getElementById('workerName').value;
            const rate = parseFloat(document.getElementById('dailyRate').value) || 0;
            const days = parseFloat(document.getElementById('daysWorked').value) || 0;
            const exp = parseFloat(document.getElementById('expense').value) || 0;

            if (name) {
                const totalWorker = (rate * days) - exp;
                data.push({ name, rate, days, exp, totalWorker, date: new Date().toLocaleDateString() });
                localStorage.setItem('pointingData', JSON.stringify(data));
                render();
                // مسح الخانات بعد الإضافة
                document.getElementById('workerName').value = '';
                document.getElementById('daysWorked').value = '';
                document.getElementById('expense').value = '0';
            }
        }

        function removeEntry(index) {
            if(confirm("واش نمسح هاد السطر؟")) {
                data.splice(index, 1);
                localStorage.setItem('pointingData', JSON.stringify(data));
                render();
            }
        }

        function render() {
            let html = '<table><tr><th>الخدام</th><th>اليومية</th><th>الأيام</th><th>تسبيق</th><th>الباقي</th><th>حذف</th></tr>';
            let grandTotal = 0;
            
            data.forEach((item, index) => {
                grandTotal += item.totalWorker;
                html += `<tr>
                    <td>${item.name}</td>
                    <td>${item.rate}</td>
                    <td>${item.days}</td>
                    <td>${item.exp}</td>
                    <td><strong>${item.totalWorker}</strong></td>
                    <td><button class="delete-btn" onclick="removeEntry(${index})">X</button></td>
                </tr>`;
            });
            html += '</table>';
            
            html += `<div class="total-box">مجموع ما يجب دفعه حالياً: ${grandTotal} درهم</div>`;
            document.getElementById('displayArea').innerHTML = html;
        }

        render();
    </script>
</body>
</html>
