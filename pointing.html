<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infraserma - بوانتاج يومي</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 15px; margin: 0; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { color: #333; text-align: center; font-size: 1.4rem; }
        
        /* تصميم اليومية (الأسبوع) */
        .calendar-week { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 20px; }
        .day-item { background: #fff; border: 2px solid #007bff; border-radius: 8px; padding: 10px; text-align: center; position: relative; cursor: pointer; }
        .day-item span { display: block; font-weight: bold; margin-bottom: 5px; color: #007bff; }
        .day-item input { width: 100%; border: none; background: transparent; text-align: center; font-size: 1.1rem; outline: none; }
        
        /* تصميم الجدول */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; font-size: 0.9rem; }
        th { background: #343a40; color: white; padding: 10px; border: 1px solid #dee2e6; }
        td { padding: 10px; text-align: center; border: 1px solid #dee2e6; }
        
        .total-box { background: #28a745; color: white; padding: 15px; border-radius: 8px; text-align: center; font-size: 1.2rem; font-weight: bold; margin-top: 20px; }
        .btn-action { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🗓️ مصاريف الأسبوع (اليومية)</h2>
        <div class="calendar-week">
            <div class="day-item"><span>إثنين</span><input type="number" class="daily-expense" placeholder="0" oninput="calculateTotal()"></div>
            <div class="day-item"><span>ثلاثاء</span><input type="number" class="daily-expense" placeholder="0" oninput="calculateTotal()"></div>
            <div class="day-item"><span>أربعاء</span><input type="number" class="daily-expense" placeholder="0" oninput="calculateTotal()"></div>
            <div class="day-item"><span>خميس</span><input type="number" class="daily-expense" placeholder="0" oninput="calculateTotal()"></div>
            <div class="day-item"><span>جمعة</span><input type="number" class="daily-expense" placeholder="0" oninput="calculateTotal()"></div>
            <div class="day-item"><span>سبت</span><input type="number" class="daily-expense" placeholder="0" oninput="calculateTotal()"></div>
            <div class="day-item"><span>أحد</span><input type="number" class="daily-expense" placeholder="0" oninput="calculateTotal()"></div>
        </div>
    </div>

    <div class="card">
        <h2>👷 بوانتاج ومصاريف الخدامة</h2>
        <table>
            <thead>
                <tr>
                    <th>الخدام</th>
                    <th>اليومية</th>
                    <th>الأيام</th>
                    <th>تسبيق</th>
                    <th>الباقي</th>
                </tr>
            </thead>
            <tbody id="workers-body">
                <tr>
                    <td>عزالدين بوعنان</td>
                    <td><input type="number" value="120" class="rate" oninput="calculateTotal()"></td>
                    <td><input type="number" value="1" class="days" oninput="calculateTotal()"></td>
                    <td><input type="number" value="20" class="adv" oninput="calculateTotal()"></td>
                    <td class="balance">100.00</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="total-box" id="grand-total-display">
        المجموع الكلي للمصاريف: 0.00 درهم
    </div>

    <script>
        function calculateTotal() {
            let totalExpenses = 0;
            let totalWorkers = 0;

            // 1. حساب مصاريف اليومية
            document.querySelectorAll('.daily-expense').forEach(input => {
                totalExpenses += parseFloat(input.value) || 0;
            });

            // 2. حساب بوانتاج الخدامة
            const rows = document.querySelectorAll('#workers-body tr');
            rows.forEach(row => {
                const rate = parseFloat(row.querySelector('.rate').value) || 0;
                const days = parseFloat(row.querySelector('.days').value) || 0;
                const adv = parseFloat(row.querySelector('.adv').value) || 0;
                
                const balance = (rate * days) - adv;
                row.querySelector('.balance').innerText = balance.toFixed(2);
                totalWorkers += balance;
            });

            // 3. المجموع الكلي (اليومية + الخدامة)
            const finalTotal = totalExpenses + totalWorkers;
            document.getElementById('grand-total-display').innerText = "المجموع الكلي حالياً: " + finalTotal.toFixed(2) + " درهم";
        }

        // تشغيل الحساب عند التحميل لأول مرة
        window.onload = calculateTotal;

        // ميزة الضغط المطول (أو مرتين) لإضافة ملاحظة
        document.querySelectorAll('.day-item').forEach(item => {
            item.onclick = function() {
                let note = prompt("شنو صرفتي فهاد النهار؟");
                if (note) {
                    this.title = note; // كيطلع فاش كتحط السهم (Tooltip)
                    alert("تم تسجيل: " + note);
                }
            };
        });
    </script>
</body>
</html>
