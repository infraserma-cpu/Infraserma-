<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 10px; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: #333; color: white; }
        .btn-green { background: #28a745; color: white; border: none; padding: 15px; width: 100%; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- الجزء ديال اليومية (مصاريف الأسبوع) -->
    <div class="card">
        <h3>مصاريف الأسبوع (اليومية)</h3>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;">
            <input type="number" placeholder="إثنين">
            <input type="number" placeholder="ثلاثاء">
            <input type="number" placeholder="أربعاء">
            <input type="number" placeholder="خميس">
            <input type="number" placeholder="جمعة">
            <input type="number" placeholder="سبت">
        </div>
    </div>

    <!-- الجزء ديال الخدامة (اللي طلبتي يرجع كيف كان) -->
    <div class="card">
        <h3>بوانتاج ومصاريف الخدامة 👷</h3>
        <input type="text" placeholder="سمية الخدام">
        <input type="number" placeholder="اليومية">
        <input type="number" placeholder="عدد الأيام">
        <input type="number" placeholder="تسبيق">
        <button class="btn-green" onclick="alert('تمت الإضافة')">قيد في الحساب</button>

        <table>
            <thead>
                <tr>
                    <th>الخدام</th><th>اليومية</th><th>الأيام</th><th>تسبيق</th><th>الباقي</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>عزالدين بوعنان</td><td>120</td><td>1</td><td>20</td><td>100</td>
                </tr>
                <tr>
                    <td>محمد</td><td>100</td><td>5</td><td>300</td><td>200</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="btn-green">مجموع ما يجب دفعه حالياً: 300 درهم</div>

</body>
</html>
